---
- name: Refuse to run as root over SSH (sshd hardening disables root login)
  ansible.builtin.assert:
    that:
      - ansible_user | default('') not in ['', 'root']
    fail_msg: >-
      ansible_user must be the unprivileged login user (polvpn), not root,
      because this role sets PermitRootLogin no.
    quiet: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    # apt-daily/unattended-upgrades hold the dpkg lock for a while after first boot.
    lock_timeout: 600

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    lock_timeout: 600

- name: Enable periodic apt updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by polvpn (Ansible).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades (security origins only)
  ansible.builtin.template:
    src: 52polvpn-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52polvpn-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable unattended-upgrades service
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Check that the login user has an authorized SSH key before disabling passwords
  ansible.builtin.stat:
    path: "~{{ ansible_user }}/.ssh/authorized_keys"
  register: base_authorized_keys

- name: Abort if key-based login is not set up (would lock us out)
  ansible.builtin.assert:
    that:
      - base_authorized_keys.stat.exists
      - base_authorized_keys.stat.size > 0
    fail_msg: "~{{ ansible_user }}/.ssh/authorized_keys is missing or empty; not hardening sshd."
    quiet: true

# Debian 12's sshd_config includes sshd_config.d/*.conf at the top and the first
# value wins, so a low-numbered drop-in overrides image defaults without editing
# the distro (or google-guest-agent) managed files.
- name: Harden sshd (key-only auth, no root login)
  ansible.builtin.template:
    src: 00-polvpn-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-polvpn-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s -h /etc/ssh/ssh_host_ed25519_key
  notify: Reload sshd

- name: Validate the full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Reconnect over a fresh SSH session to prove login still works
  ansible.builtin.meta: reset_connection

- name: Verify SSH login with the hardened configuration
  ansible.builtin.ping:
