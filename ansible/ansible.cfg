# polvpn Ansible configuration.
# Run from this directory (the wrapper uses cwd /work/ansible):
#   ansible-playbook site.yml [--limit <server>]
# Relative paths below are relative to this directory:
#   - private_key_file is a "path" setting, which Ansible resolves relative to this file.
#   - UserKnownHostsFile is passed verbatim to ssh, which resolves it relative to the cwd,
#     so ansible-playbook must be started from this directory.

[defaults]
inventory = inventory/hosts.yml
private_key_file = ../.secrets/polvpn_ed25519
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
show_task_path_on_failure = True
forks = 10
inject_facts_as_vars = False
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o UserKnownHostsFile=../.secrets/known_hosts -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15
